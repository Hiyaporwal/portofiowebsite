<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="netflixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14070a"/>
      <stop offset="100%" stop-color="#240a10"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#netflixBg)"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="760" height="46" rx="8" fill="#2d0f17" opacity="0.7"/>
  <circle cx="45" cy="43" r="6" fill="#ef4444"/>
  <circle cx="65" cy="43" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="43" r="6" fill="#10b981"/>
  <text x="115" y="48" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Netflix Global Catalog EDA · Python / Pandas / Matplotlib</text>
  <rect x="630" y="30" width="130" height="26" rx="13" fill="#e11d48" fill-opacity="0.25"/>
  <text x="645" y="47" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Jupyter Analysis</text>

  <!-- Metric Badges -->
  <rect x="20" y="80" width="235" height="90" rx="8" fill="#200d13" stroke="#4c1d29" stroke-width="1"/>
  <text x="35" y="105" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">TOTAL TITLES CATALOGED</text>
  <text x="35" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">8,807 Titles</text>
  <text x="35" y="160" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11">69.6% Movies · 30.4% TV Shows</text>

  <rect x="275" y="80" width="245" height="90" rx="8" fill="#200d13" stroke="#4c1d29" stroke-width="1"/>
  <text x="290" y="105" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">TOP PRODUCING COUNTRIES</text>
  <text x="290" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">US, IN, UK</text>
  <text x="290" y="160" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11">United States (3,689) leads production</text>

  <rect x="540" y="80" width="240" height="90" rx="8" fill="#200d13" stroke="#4c1d29" stroke-width="1"/>
  <text x="555" y="105" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">CONTENT ADDITION PEAK</text>
  <text x="555" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">2018–2020</text>
  <text x="555" y="160" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11">Rapid surge in international originals</text>

  <!-- Left: Timeline Line Chart -->
  <rect x="20" y="185" width="460" height="295" rx="8" fill="#1b0b10" stroke="#4c1d29" stroke-width="1"/>
  <text x="40" y="215" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Release Year Trends (Movies vs TV Shows)</text>
  
  <!-- Curve for Movies -->
  <path d="M 50,420 Q 150,410 240,380 T 360,260 T 440,240" fill="none" stroke="#e11d48" stroke-width="3"/>
  <!-- Curve for TV Shows -->
  <path d="M 50,430 Q 150,425 240,410 T 360,330 T 440,290" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4"/>
  
  <line x1="50" y1="440" x2="450" y2="440" stroke="#334155" stroke-width="1"/>
  <text x="60" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2000</text>
  <text x="180" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2010</text>
  <text x="310" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2018</text>
  <text x="420" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2021</text>
  
  <circle cx="340" cy="225" r="4" fill="#e11d48"/>
  <text x="350" y="228" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10">Movies</text>
  <circle cx="400" cy="225" r="4" fill="#38bdf8"/>
  <text x="410" y="228" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10">TV Series</text>

  <!-- Right: Ratings & Genre Breakdown -->
  <rect x="495" y="185" width="285" height="295" rx="8" fill="#1b0b10" stroke="#4c1d29" stroke-width="1"/>
  <text x="515" y="215" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Top Maturity Ratings</text>

  <rect x="515" y="235" width="245" height="40" rx="4" fill="#2d0f17"/>
  <text x="525" y="255" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TV-MA (Mature Adults)</text>
  <text x="525" y="268" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10">3,207 titles (36.4%)</text>

  <rect x="515" y="285" width="245" height="40" rx="4" fill="#2d0f17"/>
  <text x="525" y="305" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TV-14 (Parents Strongly Cautioned)</text>
  <text x="525" y="318" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10">2,160 titles (24.5%)</text>

  <rect x="515" y="335" width="245" height="40" rx="4" fill="#2d0f17"/>
  <text x="525" y="355" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">R (Restricted)</text>
  <text x="525" y="368" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10">799 titles (9.1%)</text>

  <rect x="515" y="385" width="245" height="40" rx="4" fill="#2d0f17"/>
  <text x="525" y="405" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TV-PG / PG-13</text>
  <text x="525" y="418" fill="#fb7185" font-family="system-ui, sans-serif" font-size="10">1,340 titles (15.2%)</text>
</svg>
