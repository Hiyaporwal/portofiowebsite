<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blinkitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a100d"/>
      <stop offset="100%" stop-color="#141e1b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#blinkitBg)"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="760" height="46" rx="8" fill="#1b2e25" opacity="0.6"/>
  <circle cx="45" cy="43" r="6" fill="#ef4444"/>
  <circle cx="65" cy="43" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="43" r="6" fill="#10b981"/>
  <text x="115" y="48" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Blinkit Sales EDA · Python / Pandas / Seaborn Analysis</text>
  <rect x="630" y="30" width="130" height="26" rx="13" fill="#10b981" fill-opacity="0.2"/>
  <text x="645" y="47" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Jupyter Notebook</text>

  <!-- Metric Badges -->
  <rect x="20" y="80" width="235" height="90" rx="8" fill="#102319" stroke="#1f4431" stroke-width="1"/>
  <text x="35" y="105" fill="#86efac" font-family="system-ui, sans-serif" font-size="11">TOTAL OUTLETS ANALYZED</text>
  <text x="35" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">8,523 Items</text>
  <text x="35" y="160" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Tier 1, Tier 2, Tier 3 Outlets</text>

  <rect x="275" y="80" width="245" height="90" rx="8" fill="#102319" stroke="#1f4431" stroke-width="1"/>
  <text x="290" y="105" fill="#86efac" font-family="system-ui, sans-serif" font-size="11">AVG SALES PER OUTLET</text>
  <text x="290" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">₹1.2M</text>
  <text x="290" y="160" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Supermarket Type 1 dominates volume</text>

  <rect x="540" y="80" width="240" height="90" rx="8" fill="#102319" stroke="#1f4431" stroke-width="1"/>
  <text x="555" y="105" fill="#86efac" font-family="system-ui, sans-serif" font-size="11">TOP CATEGORY</text>
  <text x="555" y="140" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">Fruits &amp; Snacks</text>
  <text x="555" y="160" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Highest item visibility index</text>

  <!-- Main Chart 1: Bar chart for sales by outlet size -->
  <rect x="20" y="185" width="450" height="295" rx="8" fill="#0f1f17" stroke="#1f4431" stroke-width="1"/>
  <text x="40" y="215" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Sales Distribution by Outlet Size &amp; Location Tier</text>
  <!-- Bars -->
  <rect x="60" y="320" width="45" height="120" rx="4" fill="#10b981"/>
  <rect x="115" y="270" width="45" height="170" rx="4" fill="#34d399"/>
  <rect x="170" y="240" width="45" height="200" rx="4" fill="#059669"/>
  
  <rect x="250" y="300" width="45" height="140" rx="4" fill="#10b981"/>
  <rect x="305" y="250" width="45" height="190" rx="4" fill="#34d399"/>
  <rect x="360" y="280" width="45" height="160" rx="4" fill="#059669"/>
  <line x1="50" y1="440" x2="430" y2="440" stroke="#334155" stroke-width="1"/>
  <text x="95" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Small Outlets</text>
  <text x="290" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Medium / Large Outlets</text>

  <!-- Right Chart 2: Correlation & Insights -->
  <rect x="485" y="185" width="295" height="295" rx="8" fill="#0f1f17" stroke="#1f4431" stroke-width="1"/>
  <text x="505" y="215" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Statistical EDA Insights</text>
  
  <rect x="505" y="235" width="255" height="65" rx="6" fill="#162e22" stroke="#25573e" stroke-width="0.8"/>
  <text x="515" y="255" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Fat Content Impact</text>
  <text x="515" y="275" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Low Fat items generate 64.7% of gross sales</text>
  <text x="515" y="290" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">across urban convenience clusters.</text>

  <rect x="505" y="315" width="255" height="65" rx="6" fill="#162e22" stroke="#25573e" stroke-width="0.8"/>
  <text x="515" y="335" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Outlet Establishment Year</text>
  <text x="515" y="355" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Outlets established in 1985 retain highest</text>
  <text x="515" y="370" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">sales stability and recurring consumer loyalty.</text>

  <rect x="505" y="395" width="255" height="65" rx="6" fill="#162e22" stroke="#25573e" stroke-width="0.8"/>
  <text x="515" y="415" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Item Visibility Negative Skew</text>
  <text x="515" y="435" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">High visibility did not guarantee sales spike;</text>
  <text x="515" y="450" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">necessity goods showed inelastic demand.</text>
</svg>
