  <path d="M 210,120 L 290,160 L 380,140 L 440,210 L 520,190" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 240,240 L 320,220 L 400,270 L 490,260" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4"/>
  <circle cx="290" cy="160" r="7" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="440" cy="210" r="7" fill="#10b981" stroke="#a7f3d0" stroke-width="2"/>
  <circle cx="520" cy="190" r="8" fill="#f59e0b" stroke="#fef08a" stroke-width="2"/>
  <rect x="210" y="92" width="140" height="22" rx="4" fill="#1e293b" opacity="0.9"/>
  <text x="220" y="107" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Active Route #402 · In Transit</text>

