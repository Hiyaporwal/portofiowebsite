  <text x="605" y="136" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">94.8%</text>
  <text x="605" y="160" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">▲ 48/51 Check-ins geo-verified</text>

