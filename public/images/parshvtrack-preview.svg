  <text x="50" y="152" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">📋 Attendance Log</text>
  <text x="50" y="186" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">⚡ Task Dispatch</text>
  <text x="50" y="220" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">👥 Employee Roster</text>
  <text x="50" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">📊 Shift Reports</text>
  <text x="50" y="288" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">⚙️ System Settings</text>

  <!-- Main Map & Status Area -->
  <rect x="195" y="80" width="380" height="250" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
