<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bg)"/>
  
  <!-- Top bar -->
  <rect x="20" y="20" width="760" height="48" rx="8" fill="#1e293b" opacity="0.6"/>
  <circle cx="45" cy="44" r="6" fill="#ef4444"/>
  <circle cx="65" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="44" r="6" fill="#10b981"/>
  <text x="115" y="49" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ParshvTrack · Field Workforce Management ERP</text>
  <rect x="630" y="32" width="130" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="648" y="48" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">● 50+ Live Users</text>

  <!-- Left Sidebar -->
