  <text x="605" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">DATABASE SYNC</text>
  <text x="605" y="266" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">PostgreSQL</text>
  <text x="605" y="290" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">REST API latency: 42ms</text>
  <text x="605" y="310" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">● Automated Transaction Locks</text>

  <!-- Bottom Task & Employee Table -->
