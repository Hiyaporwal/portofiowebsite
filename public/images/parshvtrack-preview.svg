  <text x="215" y="372" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Real-Time Field Tasks & Dispatch Workflow</text>
  
  <rect x="215" y="390" width="170" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="225" y="410" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Site Survey · Zone 2</text>
  <text x="225" y="428" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Agent: Rajesh K. (Online)</text>
  <text x="225" y="448" fill="#10b981" font-family="system-ui, sans-serif" font-size="10">Geo-tag: Validated (±3m)</text>

  <rect x="400" y="390" width="170" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="410" y="410" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Material Delivery · Unit 5</text>
  <text x="410" y="428" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Agent: Aman V. (En Route)</text>
  <text x="410" y="448" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">ETA: 14 mins · Speed: 28 km/h</text>

  <rect x="585" y="390" width="180" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <text x="595" y="410" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Audit Completion · Hub</text>
  <text x="595" y="428" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Agent: Priya S. (Submitted)</text>
  <text x="595" y="448" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Sync Status: Completed</text>
</svg>
